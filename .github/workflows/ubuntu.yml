name: Linux, gcc

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup
        run: |
          sudo apt-get update
          sudo sudo apt-get install -y help2man

      - name: Build
        run: |
          ./autogen.sh
          make -j4

      - name: Test
        run: make check
